# MacBook Air trackpad (bcm5974), driven by xf86-input-libinput
Section "InputClass"
    Identifier "MacBook trackpad"
    MatchIsTouchpad "on"
    MatchDriver "libinput"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
    Option "NaturalScrolling" "true"
    Option "ScrollMethod" "twofinger"
    # the whole pad is one button, so use finger count instead of pad regions
    Option "ClickMethod" "clickfinger"
    Option "DisableWhileTyping" "true"
    Option "AccelSpeed" "0.4"
EndSection
