<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- 
    Standardize the generic font families on the Ubuntu fonts.
    The system's fontconfig's 45/60-generic.conf force the emoji language (und-zsye) and font onto every pattern, so monospace/sans-serif/serif resolve to "Noto Color Emoji". 
    For each font we strongly prepend the Ubuntu family and drop the emoji language contamination so the Ubuntu font wins. 
    Emoji itself is left untouched, so real emoji still render via the emoji alias. 
  -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Ubuntu</string>
    </edit>
    <edit name="lang" mode="delete"/>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Ubuntu</string>
    </edit>
    <edit name="lang" mode="delete"/>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>UbuntuMono Nerd Font</string>
    </edit>
    <edit name="lang" mode="delete"/>
  </match>
  <!-- Map common web/Electron aliases to Ubuntu too -->
  <match target="pattern">
    <test name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Ubuntu</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>-apple-system</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Ubuntu</string>
    </edit>
  </match>
  <!-- Keep the Ubuntu families as the default target of the generic aliases -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Ubuntu</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Ubuntu</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>UbuntuMono Nerd Font</family>
      <family>Ubuntu Mono</family>
    </prefer>
  </alias>
</fontconfig>
